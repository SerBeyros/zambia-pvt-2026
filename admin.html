<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zambia PVT 2026 - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-card h3 {
            font-size: 36px;
            color: #1e3c72;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            color: #666;
            font-size: 14px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }
        
        .tab.active {
            color: #1e3c72;
            border-bottom-color: #1e3c72;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        
        thead, tbody { display: table; width: 100%; table-layout: fixed; }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-pending { background: #ffc107; color: #000; }
        .status-approved { background: #28a745; color: white; }
        .status-rejected { background: #dc3545; color: white; }
        .status-active { background: #28a745; color: white; }
        .status-inactive { background: #dc3545; color: white; }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        
        .btn-primary { background: #1e3c72; color: white; }
        .btn-approve { background: #28a745; color: white; }
        .btn-reject { background: #dc3545; color: white; }
        .btn-view { background: #007bff; color: white; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-secondary { background: #6c757d; color: white; }
        
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .hidden { display: none; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            width: 90%;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .result-section {
            margin: 20px 0;
        }
        
        .result-section h3 {
            color: #1e3c72;
            margin-bottom: 10px;
        }
        
        .result-item {
            background: #f8f9fa;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .chart-container {
            margin: 20px 0;
        }
        
        .chart-bar {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .chart-label {
            width: 150px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .chart-bar-fill {
            height: 30px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        @media (max-width: 768px) {
            .tabs { flex-wrap: nowrap; overflow-x: scroll; }
            table { font-size: 12px; }
            th, td { padding: 8px; }
            button { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="header">
            <h1 style="text-align: center;">🗳️ Zambia PVT 2026 - Admin</h1>
        </div>
        <div class="login-container">
            <div class="card">
                <h2>Admin Login</h2>
                <input type="text" id="username" placeholder="Username" value="admin">
                <input type="password" id="password" placeholder="Password" value="admin2026">
                <button onclick="login()" style="width: 100%; background: #1e3c72; color: white; padding: 12px;">Login</button>
                <div id="loginError" style="color: red; margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <div>
                    <h1>🗳️ Zambia PVT 2026 - Admin Dashboard</h1>
                    <p id="adminName"></p>
                </div>
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Statistics -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalObservers">0</h3>
                    <p>Total Observers</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalSubmissions">0</h3>
                    <p>Total Submissions</p>
                </div>
                <div class="stat-card">
                    <h3 id="pendingCount" style="color: #ffc107;">0</h3>
                    <p>Pending Approval</p>
                </div>
                <div class="stat-card">
                    <h3 id="approvedCount" style="color: #28a745;">0</h3>
                    <p>Approved</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="card">
                <div class="tabs">
                    <button class="tab active" onclick="showTab('observers')">Manage Observers</button>
                    <button class="tab" onclick="showTab('pending')">Pending Submissions</button>
                    <button class="tab" onclick="showTab('approved')">Approved</button>
                    <button class="tab" onclick="showTab('results')">Live Results</button>
                    <button class="tab" onclick="showTab('provinces')">Province Breakdown</button>
                </div>

                <!-- Observers Tab -->
                <div id="observersTab">
                    <button onclick="showCreateObserverModal()" class="btn-primary" style="margin-bottom: 20px;">
                        + Create New Observer
                    </button>
                    <div id="observersList"></div>
                </div>

                <!-- Pending Submissions -->
                <div id="pendingTab" class="hidden">
                    <div id="pendingList"></div>
                </div>

                <!-- Approved Submissions -->
                <div id="approvedTab" class="hidden">
                    <div id="approvedList"></div>
                </div>

                <!-- Results Tab -->
                <div id="resultsTab" class="hidden">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Election Type:</label>
                        <select id="electionType" onchange="loadResults()" style="padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;">
                            <option value="presidential">Presidential</option>
                            <option value="parliamentary">Parliamentary</option>
                            <option value="council">Council</option>
                        </select>
                    </div>
                    <div id="resultsChart"></div>
                </div>

                <!-- Provinces Tab -->
                <div id="provincesTab" class="hidden">
                    <div id="provinceStats"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Observer Modal -->
    <div id="observerModal" class="modal">
        <div class="modal-content">
            <h2 id="observerModalTitle">Create New Observer</h2>
            <div id="observerModalAlert"></div>
            
            <div class="form-group">
                <label>Username *</label>
                <input type="text" id="observerUsername" placeholder="observer123">
            </div>
            
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="observerPassword" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="observerFullName" placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="observerPhone" placeholder="+260977123456">
            </div>
            
            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" id="observerEmail" placeholder="john@example.com">
            </div>
            
            <div class="form-group">
                <label>National ID (Optional)</label>
                <input type="text" id="observerNationalId" placeholder="123456/78/9">
            </div>
            
            <div class="form-group">
                <label>Organization (Optional)</label>
                <input type="text" id="observerOrganization" placeholder="Electoral Commission">
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;">
                <button onclick="saveObserver()" class="btn-primary" style="flex: 1;">Save Observer</button>
                <button onclick="closeObserverModal()" class="btn-secondary" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Submission Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">Submission Details</h2>
                <button onclick="closeDetailModal()" class="btn-secondary">✕ Close</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        // IMPORTANT: Change this to your actual Render backend URL
        const API_URL = 'https://zambia-pvt-2026.onrender.com/api';
        
        let token = null;
        let currentUser = null;
        let editingObserverId = null;

        // ==================== LOGIN ====================
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error);
                
                if (data.user.role !== 'admin') {
                    throw new Error('Admin access only');
                }
                
                token = data.token;
                currentUser = data.user;
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('adminName').textContent = currentUser.full_name;
                
                loadStats();
                loadObservers();
            } catch (error) {
                errorEl.textContent = error.message;
            }
        }

        function logout() {
            token = null;
            currentUser = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        // ==================== STATS ====================
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                document.getElementById('totalObservers').textContent = data.total_observers.toLocaleString();
                document.getElementById('totalSubmissions').textContent = data.total_submissions.toLocaleString();
                document.getElementById('pendingCount').textContent = data.pending.toLocaleString();
                document.getElementById('approvedCount').textContent = data.approved.toLocaleString();
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // ==================== OBSERVER MANAGEMENT ====================
        async function loadObservers() {
            try {
                const res = await fetch(`${API_URL}/observers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const list = document.getElementById('observersList');
                
                if (data.observers.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No observers yet. Create your first observer account!</p>';
                    return;
                }
                
                let html = '<div style="overflow-x: auto;"><table><tr><th>Username</th><th>Full Name</th><th>Phone</th><th>Status</th><th>Created</th><th>Actions</th></tr>';
                
                data.observers.forEach(obs => {
                    const status = obs.is_active ? 'active' : 'inactive';
                    html += `
                        <tr>
                            <td><strong>${obs.username}</strong></td>
                            <td>${obs.full_name}</td>
                            <td>${obs.phone}</td>
                            <td><span class="status status-${status}">${status.toUpperCase()}</span></td>
                            <td>${new Date(obs.created_at).toLocaleDateString()}</td>
                            <td>
                                <button class="btn-edit" onclick="editObserver(${obs.id})">Edit</button>
                                ${obs.is_active ? 
                                    `<button class="btn-reject" onclick="deactivateObserver(${obs.id})">Deactivate</button>` :
                                    `<button class="btn-approve" onclick="activateObserver(${obs.id})">Activate</button>`
                                }
                            </td>
                        </tr>
                    `;
                });
                
                html += '</table></div>';
                list.innerHTML = html;
            } catch (error) {
                console.error('Failed to load observers:', error);
            }
        }

        function showCreateObserverModal() {
            editingObserverId = null;
            document.getElementById('observerModalTitle').textContent = 'Create New Observer';
            document.getElementById('observerUsername').value = '';
            document.getElementById('observerPassword').value = '';
            document.getElementById('observerFullName').value = '';
            document.getElementById('observerPhone').value = '';
            document.getElementById('observerEmail').value = '';
            document.getElementById('observerNationalId').value = '';
            document.getElementById('observerOrganization').value = '';
            document.getElementById('observerModalAlert').innerHTML = '';
            document.getElementById('observerUsername').disabled = false;
            document.getElementById('observerModal').classList.add('show');
        }

        async function editObserver(id) {
            editingObserverId = id;
            document.getElementById('observerModalTitle').textContent = 'Edit Observer';
            
            try {
                const res = await fetch(`${API_URL}/observers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const observer = data.observers.find(o => o.id === id);
                
                if (observer) {
                    document.getElementById('observerUsername').value = observer.username;
                    document.getElementById('observerUsername').disabled = true;
                    document.getElementById('observerPassword').value = '';
                    document.getElementById('observerPassword').placeholder = 'Leave blank to keep current password';
                    document.getElementById('observerFullName').value = observer.full_name;
                    document.getElementById('observerPhone').value = observer.phone;
                    document.getElementById('observerEmail').value = observer.email || '';
                    document.getElementById('observerNationalId').value = observer.national_id || '';
                    document.getElementById('observerOrganization').value = observer.organization || '';
                    document.getElementById('observerModalAlert').innerHTML = '';
                    document.getElementById('observerModal').classList.add('show');
                }
            } catch (error) {
                alert('Failed to load observer details');
            }
        }

        async function saveObserver() {
            const alertEl = document.getElementById('observerModalAlert');
            alertEl.innerHTML = '';
            
            const username = document.getElementById('observerUsername').value;
            const password = document.getElementById('observerPassword').value;
            const full_name = document.getElementById('observerFullName').value;
            const phone = document.getElementById('observerPhone').value;
            const email = document.getElementById('observerEmail').value;
            const national_id = document.getElementById('observerNationalId').value;
            const organization = document.getElementById('observerOrganization').value;
            
            if (!full_name || !phone) {
                alertEl.innerHTML = '<div class="alert alert-error">Full name and phone are required</div>';
                return;
            }
            
            if (!editingObserverId && !username) {
                alertEl.innerHTML = '<div class="alert alert-error">Username is required</div>';
                return;
            }
            
            if (!editingObserverId && !password) {
                alertEl.innerHTML = '<div class="alert alert-error">Password is required for new observers</div>';
                return;
            }
            
            try {
                const body = { full_name, phone, email, national_id, organization };
                
                if (!editingObserverId) {
                    body.username = username;
                    body.password = password;
                }
                
                if (editingObserverId && password) {
                    body.password = password;
                }
                
                const url = editingObserverId ? 
                    `${API_URL}/observers/${editingObserverId}` : 
                    `${API_URL}/observers`;
                
                const method = editingObserverId ? 'PUT' : 'POST';
                
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });
                
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Failed to save observer');
                
                closeObserverModal();
                loadObservers();
                loadStats();
                alert(editingObserverId ? '✓ Observer updated successfully' : '✓ Observer created successfully');
            } catch (error) {
                alertEl.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        }

        function closeObserverModal() {
            document.getElementById('observerModal').classList.remove('show');
            document.getElementById('observerUsername').disabled = false;
            document.getElementById('observerPassword').placeholder = '••••••••';
        }

        async function deactivateObserver(id) {
            if (!confirm('Are you sure you want to deactivate this observer?')) return;
            
            try {
                const res = await fetch(`${API_URL}/observers/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alert('✓ Observer deactivated');
                    loadObservers();
                    loadStats();
                }
            } catch (error) {
                alert('Failed to deactivate observer');
            }
        }

        async function activateObserver(id) {
            try {
                const res = await fetch(`${API_URL}/observers/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ is_active: true })
                });
                
                if (res.ok) {
                    alert('✓ Observer activated');
                    loadObservers();
                    loadStats();
                }
            } catch (error) {
                alert('Failed to activate observer');
            }
        }

        // ==================== SUBMISSIONS ====================
        async function loadPending() {
            try {
                const res = await fetch(`${API_URL}/submissions?status=pending`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const list = document.getElementById('pendingList');
                
                if (data.submissions.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No pending submissions</p>';
                    return;
                }
                
                let html = '<div style="overflow-x: auto;"><table><tr><th>Polling Station</th><th>Location</th><th>Observer</th><th>Submitted</th><th>Actions</th></tr>';
                
                data.submissions.forEach(sub => {
                    html += `
                        <tr>
                            <td><strong>${sub.polling_station}</strong></td>
                            <td>${sub.ward}, ${sub.constituency}<br><small>${sub.district}, ${sub.province}</small></td>
                            <td>${sub.observer_full_name}<br><small>${sub.observer_phone}</small></td>
                            <td>${new Date(sub.submitted_at).toLocaleString()}</td>
                            <td>
                                <button class="btn-view" onclick="viewDetails(${sub.id})">View</button>
                                <button class="btn-approve" onclick="approve(${sub.id})">✓ Approve</button>
                                <button class="btn-reject" onclick="reject(${sub.id})">✗ Reject</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</table></div>';
                list.innerHTML = html;
            } catch (error) {
                console.error('Failed to load pending:', error);
            }
        }

        async function loadApproved() {
            try {
                const res = await fetch(`${API_URL}/submissions?status=approved`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const list = document.getElementById('approvedList');
                
                if (data.submissions.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No approved submissions</p>';
                    return;
                }
                
                let html = '<div style="overflow-x: auto;"><table><tr><th>Polling Station</th><th>Location</th><th>Observer</th><th>Approved</th><th>Actions</th></tr>';
                
                data.submissions.forEach(sub => {
                    html += `
                        <tr>
                            <td><strong>${sub.polling_station}</strong></td>
                            <td>${sub.ward}, ${sub.constituency}<br><small>${sub.district}, ${sub.province}</small></td>
                            <td>${sub.observer_full_name}</td>
                            <td>${new Date(sub.approved_at || sub.submitted_at).toLocaleString()}</td>
                            <td><button class="btn-view" onclick="viewDetails(${sub.id})">View Details</button></td>
                        </tr>
                    `;
                });
                
                html += '</table></div>';
                list.innerHTML = html;
            } catch (error) {
                console.error('Failed to load approved:', error);
            }
        }

        async function viewDetails(id) {
            try {
                const res = await fetch(`${API_URL}/submissions/${id}`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
