<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zambia PVT 2026 - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-card h3 {
            font-size: 36px;
            color: #1e3c72;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            color: #666;
            font-size: 14px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            color: #1e3c72;
            border-bottom-color: #1e3c72;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-pending { background: #ffc107; color: #000; }
        .status-approved { background: #28a745; color: white; }
        .status-rejected { background: #dc3545; color: white; }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-right: 5px;
        }
        
        .btn-approve { background: #28a745; color: white; }
        .btn-reject { background: #dc3545; color: white; }
        .btn-view { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        
        button:hover { opacity: 0.9; }
        
        .hidden { display: none; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            width: 90%;
        }
        
        .result-section {
            margin: 20px 0;
        }
        
        .result-section h3 {
            color: #1e3c72;
            margin-bottom: 10px;
        }
        
        .result-item {
            background: #f8f9fa;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .chart-container {
            margin: 20px 0;
        }
        
        .chart-bar {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .chart-label {
            width: 150px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .chart-bar-fill {
            height: 30px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="header">
            <h1 style="text-align: center;">🗳️ Zambia PVT 2026 - Admin</h1>
        </div>
        <div class="login-container">
            <div class="card">
                <h2>Admin Login</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button onclick="login()" style="width: 100%; background: #1e3c72; color: white; padding: 12px;">Login</button>
                <div id="loginError" style="color: red; margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>🗳️ Zambia PVT 2026 - Admin Dashboard</h1>
                    <p id="adminName"></p>
                </div>
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Statistics -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalStations">0</h3>
                    <p>Total Stations</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalSubmissions">0</h3>
                    <p>Total Submissions</p>
                </div>
                <div class="stat-card">
                    <h3 id="pendingCount" style="color: #ffc107;">0</h3>
                    <p>Pending Approval</p>
                </div>
                <div class="stat-card">
                    <h3 id="approvedCount" style="color: #28a745;">0</h3>
                    <p>Approved</p>
                </div>
                <div class="stat-card">
                    <h3 id="coveragePercent">0%</h3>
                    <p>Coverage</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="card">
                <div class="tabs">
                    <button class="tab active" onclick="showTab('pending')">Pending Submissions</button>
                    <button class="tab" onclick="showTab('approved')">Approved</button>
                    <button class="tab" onclick="showTab('results')">Live Results</button>
                    <button class="tab" onclick="showTab('provinces')">Province Breakdown</button>
                </div>

                <!-- Pending Submissions -->
                <div id="pendingTab">
                    <div id="pendingList"></div>
                </div>

                <!-- Approved Submissions -->
                <div id="approvedTab" class="hidden">
                    <div id="approvedList"></div>
                </div>

                <!-- Results Tab -->
                <div id="resultsTab" class="hidden">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Election Type:</label>
                        <select id="electionType" onchange="loadResults()" style="padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;">
                            <option value="presidential">Presidential</option>
                            <option value="parliamentary">Parliamentary</option>
                            <option value="council">Council</option>
                        </select>
                    </div>
                    <div id="resultsChart"></div>
                </div>

                <!-- Provinces Tab -->
                <div id="provincesTab" class="hidden">
                    <div id="provinceStats"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">Submission Details</h2>
                <button onclick="closeModal()" class="btn-secondary">✕ Close</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://zambia-pvt-2026.onrender.com/api';
        let token = null;
        let currentUser = null;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error);
                
                if (data.user.role !== 'admin') {
                    throw new Error('Admin access only');
                }
                
                token = data.token;
                currentUser = data.user;
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('adminName').textContent = currentUser.full_name;
                
                loadStats();
                loadPending();
            } catch (error) {
                errorEl.textContent = error.message;
            }
        }

        function logout() {
            token = null;
            currentUser = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                document.getElementById('totalStations').textContent = data.total_stations.toLocaleString();
                document.getElementById('totalSubmissions').textContent = data.total_submissions.toLocaleString();
                document.getElementById('pendingCount').textContent = data.pending.toLocaleString();
                document.getElementById('approvedCount').textContent = data.approved.toLocaleString();
                document.getElementById('coveragePercent').textContent = data.coverage + '%';
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadPending() {
            try {
                const res = await fetch(`${API_URL}/submissions?status=pending`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const list = document.getElementById('pendingList');
                
                if (data.submissions.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No pending submissions</p>';
                    return;
                }
                
                let html = '<table><tr><th>Station</th><th>Province</th><th>Observer</th><th>Submitted</th><th>Actions</th></tr>';
                
                data.submissions.forEach(sub => {
                    html += `
                        <tr>
                            <td><strong>${sub.code}</strong><br><small>${sub.name}</small></td>
                            <td>${sub.province}<br><small>${sub.district}</small></td>
                            <td>${sub.observer_name}<br><small>${sub.observer_phone}</small></td>
                            <td>${new Date(sub.submitted_at).toLocaleString()}</td>
                            <td>
                                <button class="btn-view" onclick="viewDetails(${sub.id})">View</button>
                                <button class="btn-approve" onclick="approve(${sub.id})">✓ Approve</button>
                                <button class="btn-reject" onclick="reject(${sub.id})">✗ Reject</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</table>';
                list.innerHTML = html;
            } catch (error) {
                console.error('Failed to load pending:', error);
            }
        }

        async function loadApproved() {
            try {
                const res = await fetch(`${API_URL}/submissions?status=approved`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const list = document.getElementById('approvedList');
                
                if (data.submissions.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No approved submissions</p>';
                    return;
                }
                
                let html = '<table><tr><th>Station</th><th>Province</th><th>Observer</th><th>Approved</th><th>Actions</th></tr>';
                
                data.submissions.forEach(sub => {
                    html += `
                        <tr>
                            <td><strong>${sub.code}</strong><br><small>${sub.name}</small></td>
                            <td>${sub.province}<br><small>${sub.district}</small></td>
                            <td>${sub.observer_name}</td>
                            <td>${new Date(sub.approved_at || sub.submitted_at).toLocaleString()}</td>
                            <td><button class="btn-view" onclick="viewDetails(${sub.id})">View Details</button></td>
                        </tr>
                    `;
                });
                
                html += '</table>';
                list.innerHTML = html;
            } catch (error) {
                console.error('Failed to load approved:', error);
            }
        }

        async function viewDetails(id) {
            try {
                const res = await fetch(`${API_URL}/submissions/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                let html = `
                    <div style="margin-bottom: 20px;">
                        <p><strong>Station:</strong> ${data.code} - ${data.name}</p>
                        <p><strong>Location:</strong> ${data.ward}, ${data.constituency}, ${data.district}, ${data.province}</p>
                        <p><strong>Observer:</strong> ${data.observer_name} (${data.observer_phone})</p>
                        <p><strong>GPS:</strong> ${data.gps_lat.toFixed(6)}, ${data.gps_lon.toFixed(6)}</p>
                        <p><strong>Status:</strong> <span class="status status-${data.status}">${data.status.toUpperCase()}</span></p>
                    </div>
                    
                    <div class="result-section">
                        <h3>🏛️ Presidential Results</h3>
                        ${data.presidential.map(c => `
                            <div class="result-item">
                                <strong>${c.candidate}</strong> (${c.party}): <strong>${c.votes.toLocaleString()} votes</strong>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-section">
                        <h3>🏢 Parliamentary Results</h3>
                        ${data.parliamentary.map(c => `
                            <div class="result-item">
                                <strong>${c.candidate}</strong> (${c.party}): <strong>${c.votes.toLocaleString()} votes</strong>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-section">
                        <h3>🏘️ Council Results</h3>
                        ${data.council.map(c => `
                            <div class="result-item">
                                <strong>${c.candidate}</strong> (${c.party}): <strong>${c.votes.toLocaleString()} votes</strong>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                document.getElementById('detailContent').innerHTML = html;
                document.getElementById('detailModal').classList.remove('hidden');
            } catch (error) {
                alert('Failed to load details');
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        async function approve(id) {
            if (!confirm('Approve this submission?')) return;
            
            try {
                const res = await fetch(`${API_URL}/submissions/${id}/approve`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alert('✓ Approved successfully');
                    loadStats();
                    loadPending();
                }
            } catch (error) {
                alert('Failed to approve');
            }
        }

        async function reject(id) {
            if (!confirm('Reject this submission?')) return;
            
            try {
                const res = await fetch(`${API_URL}/submissions/${id}/reject`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alert('✓ Rejected');
                    loadStats();
                    loadPending();
                }
            } catch (error) {
                alert('Failed to reject');
            }
        }

        async function loadResults() {
            const type = document.getElementById('electionType').value;
            
            try {
                const res = await fetch(`${API_URL}/results?type=${type}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const container = document.getElementById('resultsChart');
                
                if (data.results.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No results yet</p>';
                    return;
                }
                
                const maxVotes = Math.max(...data.results.map(r => r.votes));
                
                let html = `<p style="margin-bottom: 20px;"><strong>Total Votes:</strong> ${data.total_votes.toLocaleString()}</p>`;
                
                data.results.forEach(result => {
                    const width = (result.votes / maxVotes * 100).toFixed(1);
                    html += `
                        <div class="chart-bar">
                            <div class="chart-label">${result.candidate}<br><small>${result.party}</small></div>
                            <div class="chart-bar-fill" style="width: ${width}%;">
                                ${result.votes.toLocaleString()} (${result.percentage}%)
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Failed to load results:', error);
            }
        }

        async function loadProvinces() {
            try {
                const res = await fetch(`${API_URL}/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const container = document.getElementById('provinceStats');
                
                let html = '<table><tr><th>Province</th><th>Approved Submissions</th></tr>';
                
                data.provinces.forEach(prov => {
                    html += `
                        <tr>
                            <td><strong>${prov.province}</strong></td>
                            <td>${prov.count.toLocaleString()}</td>
                        </tr>
                    `;
                });
                
                html += '</table>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Failed to load provinces:', error);
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('[id$="Tab"]').forEach(t => t.classList.add('hidden'));
            
            event.target.classList.add('active');
            
            if (tab === 'pending') {
                document.getElementById('pendingTab').classList.remove('hidden');
                loadPending();
            } else if (tab === 'approved') {
                document.getElementById('approvedTab').classList.remove('hidden');
                loadApproved();
            } else if (tab === 'results') {
                document.getElementById('resultsTab').classList.remove('hidden');
                loadResults();
            } else if (tab === 'provinces') {
                document.getElementById('provincesTab').classList.remove('hidden');
                loadProvinces();
            }
        }
    </script>
</body>
</html>
